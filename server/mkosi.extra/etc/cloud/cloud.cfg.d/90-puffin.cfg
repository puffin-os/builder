datasource_list: [NoCloud]
ssh_pwauth: false

growpart:
  mode: "off"
resize_rootfs: false

system_info:
  default_user:
    name: puffin
    lock_passwd: true
    gecos: Puffin Administrator
    groups: [wheel, users, docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
  network:
    renderers: [networkd]
    activators: [networkd]
