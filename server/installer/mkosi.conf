[Include]
Include=../../base/mkosi.conf

[Output]
Output=puffin-server-installer-x86-64
OutputDirectory=../../out
ImageId=puffin-server-installer

[Content]
ExtraTrees=
        ../../base/mkosi.extra
        ../../out/installer-tree
Initrds=
