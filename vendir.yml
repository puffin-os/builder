apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: base
    contents:
      - path: .
        git:
          url: https://github.com/puffin-os/base
          ref: main
        excludePaths:
          - .git
          - .git/**/*
  - path: shared
    contents:
      - path: .
        git:
          url: https://github.com/puffin-os/shared
          ref: main
        excludePaths:
          - .git
          - .git/**/*
  - path: server
    contents:
      - path: .
        git:
          url: https://github.com/puffin-os/server
          ref: main
        excludePaths:
          - .git
          - .git/**/*
  - path: desktop
    contents:
      - path: .
        git:
          url: https://github.com/puffin-os/desktop
          ref: main
        excludePaths:
          - .git
          - .git/**/*
  - path: workstation
    contents:
      - path: .
        git:
          url: https://github.com/puffin-os/workstation
          ref: main
        excludePaths:
          - .git
          - .git/**/*
