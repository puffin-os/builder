version: '3'

tasks:
  summary:
    cmds:
      - task: ':keys'
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - '{{.CONTAINER}} -w /work/desktop {{.BUILDER}} mkosi --profile=dev {{.KEYS}} summary'

  flatpaks:lock:
    cmds:
      - task: ':builder'
      - mkdir -p '{{.ROOT}}/out'
      - '{{.CONTAINER}} {{.BUILDER}} /work/dev/flatpak-seed.sh lock'

  flatpaks:build:
    internal: true
    sources:
      - flatpaks.apps
      - flatpaks.lock
      - '{{.ROOT}}/dev/flatpak-seed.sh'
    generates:
      - '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'
    cmds:
      - task: ':builder'
      - mkdir -p '{{.ROOT}}/out'
      - '{{.CONTAINER}} {{.BUILDER}} /work/dev/flatpak-seed.sh build'

  build:
    cmds:
      - task: ':keys'
      - task: flatpaks:build
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - '{{.CONTAINER}} -w /work/desktop {{.BUILDER}} mkosi --profile=dev {{.KEYS}} -f build'
      - >-
        '{{.ROOT}}/dev/install-flatpak-seed.sh'
        '{{.ROOT}}/out/puffin-desktop-x86-64.raw'
        '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'

  ensure-built:
    internal: true
    status:
      - test -f '{{.ROOT}}/out/puffin-desktop-x86-64.raw'
    cmds:
      - task: build

  run:
    cmds:
      - task: ensure-built
      - PUFFIN_FLAVOR=desktop PUFFIN_GRAPHICS=1 '{{.ROOT}}/dev/qemu.sh'

  check:
    cmds:
      - task: ensure-built
      - >-
        '{{.ROOT}}/dev/check-desktop-image.sh'
        '{{.ROOT}}/out/puffin-desktop-x86-64.raw'
        '{{.ROOT}}/out/puffin-desktop-x86-64.manifest'
      - PUFFIN_FLAVOR=desktop '{{.ROOT}}/dev/qemu.sh' --check

  reset:
    cmds:
      - rm -f -- '{{.ROOT}}/state/puffin-desktop.qcow2' '{{.ROOT}}/state/OVMF_VARS-desktop.fd'

  installer:build:
    cmds:
      - task: build
      - rm -rf -- '{{.ROOT}}/out/desktop-installer-tree'
      - mkdir -p '{{.ROOT}}/out/desktop-installer-tree/usr/lib/puffin'
      - >-
        {{.CONTAINER}} {{.BUILDER}} zstd -T0 -f
        /work/out/puffin-desktop-x86-64.raw
        -o /work/out/desktop-installer-tree/usr/lib/puffin/puffin-desktop-x86-64.raw.zst
      - >-
        cp -- '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'
        '{{.ROOT}}/out/desktop-installer-tree/usr/lib/puffin/'
      - '{{.CONTAINER}} -w /work/desktop/installer {{.BUILDER}} mkosi --profile=dev {{.KEYS}} -f build'
      - >-
        '{{.ROOT}}/dev/install-flatpak-seed.sh'
        '{{.ROOT}}/out/puffin-desktop-x86-64.raw'
        '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'

  installer:ensure-built:
    internal: true
    status:
      - test -f '{{.ROOT}}/out/puffin-desktop-installer-x86-64.raw'
    cmds:
      - task: installer:build

  installer:run:
    cmds:
      - task: installer:ensure-built
      - PUFFIN_FLAVOR=desktop '{{.ROOT}}/dev/qemu-installer.sh'

  installer:installed-run:
    cmds:
      - "PUFFIN_FLAVOR=desktop '{{.ROOT}}/dev/qemu-installer.sh' installed"

  installer:check:
    cmds:
      - task: installer:ensure-built
      - >-
        {{.CONTAINER}} -w /work/desktop/installer {{.BUILDER}}
        /work/dev/check-desktop-installer-image.sh
        /work/out/puffin-desktop-installer-x86-64.raw
      - PUFFIN_FLAVOR=desktop-installer '{{.ROOT}}/dev/qemu.sh' --check

  installer:reset:
    cmds:
      - >-
        rm -f --
        '{{.ROOT}}/state/puffin-desktop-installer.qcow2'
        '{{.ROOT}}/state/puffin-desktop-target.qcow2'
        '{{.ROOT}}/state/OVMF_VARS-desktop-installer.fd'
        '{{.ROOT}}/state/swtpm-desktop.sock'
      - rm -rf -- '{{.ROOT}}/state/tpm-desktop'
