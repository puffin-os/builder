version: '3'

tasks:
  summary:
    desc: Show the workstation image build summary
    cmds:
      - task: ':keys'
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - '{{.CONTAINER}} -w /work/workstation {{.BUILDER}} mkosi --profile=dev {{.KEYS}} summary'

  build:
    desc: Build the workstation image
    cmds:
      - task: ':keys'
      - task: ':desktop:flatpaks:build'
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - >-
        {{.CONTAINER}} -w /work/workstation {{.BUILDER}} mkosi --profile=dev {{.KEYS}}
        {{if .IMAGE_VERSION}}--image-version={{.IMAGE_VERSION}}{{end}} -f build
      - >-
        '{{.ROOT}}/dev/install-flatpak-seed.sh'
        '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
        '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'

  ensure-built:
    internal: true
    desc: Build the workstation image if sources changed
    method: checksum
    sources:
      - mkosi.conf
      - ../desktop/mkosi.conf
      - ../desktop/mkosi.extra/**
      - ../base/mkosi.conf
      - ../base/mkosi.extra/**
      - ../base/mkosi.repart/**
      - ../shared/mkosi.extra/**
      - '{{.ROOT}}/out/puffin-desktop-flatpaks-x86-64.tar.zst'
    generates:
      - '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
    cmds:
      - task: build

  run:
    desc: Boot the workstation image in QEMU
    cmds:
      - task: ensure-built
      - PUFFIN_FLAVOR=workstation PUFFIN_GRAPHICS=1 '{{.ROOT}}/dev/qemu.sh'

  check:
    desc: Validate and boot-check the workstation image
    cmds:
      - task: ensure-built
      - >-
        '{{.ROOT}}/dev/check-desktop-image.sh'
        '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
        '{{.ROOT}}/out/puffin-workstation-x86-64.manifest'
        puffin-workstation
      - PUFFIN_FLAVOR=workstation '{{.ROOT}}/dev/qemu.sh' --check

  reset:
    desc: Remove persistent workstation VM state
    cmds:
      - rm -f -- '{{.ROOT}}/state/puffin-workstation.qcow2' '{{.ROOT}}/state/OVMF_VARS-workstation.fd'